name: tests

on:
  push:
  pull_request:

jobs:
  simulator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: System dependencies
        run: sudo apt-get update && sudo apt-get install -y gfortran python3-tk
      - name: Install
        run: python -m pip install -r requirements-dev.txt
      - name: Tests
        run: python -m unittest discover -s tests -v
      - name: Lint
        run: ruff check nozzle_simulator tests run_simulator.py

